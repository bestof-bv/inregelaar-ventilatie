<p lang="en">The app has moved to <a href="https://vstool.hvac-service.be/">vstool.hvac-service.be</a>.</p>
</main>
<script>
// remove the old offline copy (service worker + caches) of the app that used to live here, then go to the new address
(async () => {
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) {}
  location.replace('https://vstool.hvac-service.be/');
})();
</script>
